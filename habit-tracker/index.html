<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker de Hábitos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-line"></i> Mis Hábitos</h1>
            <div class="stats">
                <div class="stat">
                    <span class="stat-value" id="completedCount">0</span>
                    <span class="stat-label">Completados</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="totalCount">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="streakCount">0</span>
                    <span class="stat-label">Racha</span>
                </div>
            </div>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input type="text" id="habitInput" placeholder="Nuevo hábito (ej. Ejercicio 30 min)" />
                <button id="addHabit" class="btn-primary">
                    <i class="fas fa-plus"></i> Añadir
                </button>
            </div>
            <div class="weekdays">
                <span class="weekday-label">Días:</span>
                <label class="day-checkbox"><input type="checkbox" checked>L</label>
                <label class="day-checkbox"><input type="checkbox" checked>M</label>
                <label class="day-checkbox"><input type="checkbox" checked>X</label>
                <label class="day-checkbox"><input type="checkbox" checked>J</label>
                <label class="day-checkbox"><input type="checkbox" checked>V</label>
                <label class="day-checkbox"><input type="checkbox" checked>S</label>
                <label class="day-checkbox"><input type="checkbox" checked>D</label>
            </div>
        </div>

        <div class="habit-container">
            <ul id="habitList"></ul>
        </div>

        <div class="controls">
            <button id="resetWeek" class="btn-secondary">
                <i class="fas fa-redo"></i> Reiniciar Semana
            </button>
            <button id="clearAll" class="btn-danger">
                <i class="fas fa-trash"></i> Eliminar Todos
            </button>
        </div>

        <div class="week-progress">
            <h3><i class="fas fa-calendar-week"></i> Progreso Semanal</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="weeklyProgress"></div>
            </div>
            <div class="progress-text" id="progressPercent">0%</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
